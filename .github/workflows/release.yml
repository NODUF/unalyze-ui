name: Release

on:
  push:
    branches: [main]

# Two runs publishing at once would race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag the commit and open the release PR
  packages: write # publish to GitHub Packages
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs the history to work out what has already been released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Publishing goes to GitHub Packages, not npmjs.
          registry-url: https://npm.pkg.github.com
          scope: '@noduf'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Nothing ships that has not installed cleanly outside this workspace. This is the gate that
      # catches an exports-map, ESM/CJS or `use client` mistake — none of which a green build sees.
      - name: Verify the artefact installs
        run: node tooling/test-fixtures.mjs

      - run: pnpm test
      - run: pnpm typecheck

      # Changesets does one of two things depending on what is pending:
      #
      #   pending changesets  → opens or updates a "Version Packages" PR. Nothing publishes.
      #   none pending        → the version bump has already been merged, so it publishes and tags.
      #
      # So a release is always two merges, and the second one is a deliberate act rather than a
      # side effect of merging a feature.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A version that shipped should be lookable-at without checking anything out. The review is
      # one self-contained HTML file — no server, no build, works offline — so attaching it to the
      # release gives every version a permanent "what did this actually look like".
      #
      # Attached to the UI package's release specifically: the tokens package has no appearance.
      - name: Attach the visual review to the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          TAG=$(node -e '
            const pkgs = JSON.parse(process.env.PUBLISHED)
            const ui = pkgs.find((p) => p.name === "@noduf/unalyze-ui")
            if (ui) console.log(`${ui.name}@${ui.version}`)
          ')
          if [ -z "$TAG" ]; then
            echo "The UI package was not part of this release — nothing to attach."
            exit 0
          fi
          echo "Attaching the review to $TAG"
          cp apps/preview/dist/unalyze-ui-review.html "unalyze-ui-${TAG##*@}.html"
          gh release upload "$TAG" "unalyze-ui-${TAG##*@}.html" --clobber

      - name: Attach the visual review to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          # A missing file here means an earlier step failed. Say that, rather than
          # adding a second red step that buries it.
          if-no-files-found: warn
          path: apps/preview/dist/unalyze-ui-review.html
